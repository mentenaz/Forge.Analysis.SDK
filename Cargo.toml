[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.0.1"
publish = false
# rust-version = "1.98"
[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
sha2   = "0.11.1"
forge-analysis-schema = { path = "crates/forge-analysis-schema" }
forge-analysis-catalog = { path = "crates/forge-analysis-catalog" }
serde_json = "1"
toml = "0.8"
# Read by forge-analysis-core to parse Cargo, Python, mise and agent config files. Pinned like oxc: it is
# a parser of hostile input. It brings in no network, process or OS crate (see deny.toml).
toml_edit = { version = "=0.22.27", default-features = false, features = ["parse"] }
oxc_allocator = "=0.159.0"
oxc_parser = "=0.159.0"
oxc_span = "=0.159.0"
oxc_ast = "=0.159.0"
oxc_semantic = "=0.159.0"
oxc_ast_visit = "=0.159.0"


[workspace.lints.rust]
unsafe_code = "forbid"
