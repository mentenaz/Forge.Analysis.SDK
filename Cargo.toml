[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.0.1"
[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
sha2   = "0.11.1"
forge-analysis-schema = { path = "crates/forge-analysis-schema" }
serde_json = "1"
toml = "0.8"


[workspace.lints.rust]
unsafe_code = "forbid"
