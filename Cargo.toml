[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.0.1"
publish = false
# rust-version = "1.98"
[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
sha2   = "0.11.1"
forge-analysis-schema = { path = "crates/forge-analysis-schema" }
serde_json = "1"
toml = "0.8"
oxc_allocator   = "0.159.0"
oxc_parser    = "0.159.0"
oxc_span      = "0.159.0"
oxc_ast = "=0.159.0"
oxc_semantic = "=0.159.0"
oxc_ast_visit = "=0.159.0"


[workspace.lints.rust]
unsafe_code = "forbid"
